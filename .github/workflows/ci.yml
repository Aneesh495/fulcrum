name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        lua-version: ["5.4", "luajit-openresty"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Lua
        uses: hishamhm/gh-actions-lua@master
        with:
          luaVersion: ${{ matrix.lua-version }}

      - name: Build C accelerator
        run: |
          make c_lib

      - name: Run test suite
        run: |
          make test

      - name: Run benchmarks
        run: |
          make bench
